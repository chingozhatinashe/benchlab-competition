# Monitors the submitted model on Benchlab (Actions -> "Monitor Benchlab" -> Run workflow).
#
#   record  (at t0 + 30 min from the laptop trigger, ci/staging/trigger_cycle.ps1; every 3 h
#           from the cron as the backup; on demand) the live runs and their logs -> the staging-records
#           branch (ci/monitor/live.py): run statuses, scrubbed logs, a staging-format run
#           record per finished run (candidate "benchlab", variant "live"), so the daily
#           staging evaluation scores the live forecasts next to the candidates; alerts for
#           a lost ELIGIBLE status, failed or missed runs, missing logs or forecasts, and a
#           forecast far from staging's run of the same commit (upload_candidate/submitted).
#           Alerts fail the run, so GitHub emails the owner (ci/staging/report_alerts.sh).
#   shape   print the shape of the portal's response: field paths, types and array lengths,
#           never values (ci/monitor/shape.jq).
#
# Needs the repository secret BENCHLAB_PORTAL (the portal link from the Benchlab email).
# Read-only towards Benchlab: it never uploads. The repository is public, so nothing secret
# may reach the log or the records: not the portal link (masked by GitHub), not presigned
# upload forms or log links. The portal's response stays in a file, deleted at the end.
name: Monitor Benchlab

on:
  schedule:
    - cron: "50 */3 * * *"  # backup for the laptop trigger; GitHub drops many of these
  workflow_dispatch:
    inputs:
      mode:
        description: "record: file the live runs and logs; shape: the portal response's field names and types (no values)"
        type: choice
        options: [record, shape]
        default: record

concurrency:
  group: staging-records  # shares the records branch with the staging workflow
  cancel-in-progress: false

permissions:
  contents: write  # the staging-records branch

jobs:
  monitor:
    name: ${{ inputs.mode || 'record' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PORTAL: ${{ secrets.BENCHLAB_PORTAL }}
      MODE: ${{ inputs.mode || 'record' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the portal
        run: |
          case "$PORTAL" in
            http*) ;;
            *) echo "::error::the BENCHLAB_PORTAL secret is missing"; exit 1 ;;
          esac
          curl -fsS --retry 3 --retry-delay 5 "$PORTAL" > "$RUNNER_TEMP/portal.json" \
            || { echo "::error::could not read the portal"; exit 1; }
          jq -e . "$RUNNER_TEMP/portal.json" > /dev/null \
            || { echo "::error::the portal did not return JSON"; exit 1; }

      - name: Shape of the portal response
        if: env.MODE == 'shape'
        run: |
          SHAPE=$(jq -r -f ci/monitor/shape.jq "$RUNNER_TEMP/portal.json")
          echo "$SHAPE"
          {
            echo "### Portal response: fields and types (no values)"
            echo '```'
            echo "$SHAPE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File the live runs and logs
        if: env.MODE == 'record'
        run: |
          bash ci/staging/records.sh checkout records
          python3 ci/monitor/live.py --portal "$RUNNER_TEMP/portal.json" --records records \
            --alerts alerts.json | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/portal.json"
          bash ci/staging/records.sh push records "live $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Alerts
        if: env.MODE == 'record'
        run: bash ci/staging/report_alerts.sh alerts.json

      - name: Remove the portal response
        if: always()
        run: rm -f "$RUNNER_TEMP/portal.json"
