# Keeps main in a state that can produce a qualifying Benchlab submission.
# A green run on main attaches a ready-to-upload submission.zip.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Set to "1" before the deadline to fail on template team_name/contact_email.
  STRICT_TEAM_INFO: "0"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Conformance kit is unmodified
        run: cd conformance_pack && bash verify.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"  # matches python3 in the ubuntu:22.04 image
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt

      - name: Submission contract
        run: python ci/check_submission.py

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests ci

      - name: Model output contract
        run: pytest -v

  container:
    name: container
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # public.ecr.aws rate-limits anonymous pulls from shared runner IPs (429).
      # Keep the base image in the Actions cache, refreshed weekly, so most runs
      # never touch the registry. docker build then uses the local copy.
      - name: Base image cache key
        id: base
        run: |
          IMAGE=$(awk 'toupper($1) == "FROM" { print $2; exit }' src/Dockerfile)
          PREFIX="base-image-$(echo "$IMAGE" | tr '/:' '--')-"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=${PREFIX}$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore base image
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: /tmp/base-image.tar
          key: ${{ steps.base.outputs.key }}
          restore-keys: ${{ steps.base.outputs.prefix }}

      - name: Load or pull base image
        id: load
        env:
          IMAGE: ${{ steps.base.outputs.image }}
          FRESH: ${{ steps.restore.outputs.cache-hit }}
        run: |
          if [ -f /tmp/base-image.tar ]; then
            docker load -i /tmp/base-image.tar
          fi
          [ "$FRESH" = "true" ] && exit 0

          # No cache, or last week's copy: try to refresh it from the registry.
          for attempt in 1 2 3; do
            if docker pull --platform linux/amd64 "$IMAGE"; then
              docker save -o /tmp/base-image.tar "$IMAGE"
              echo "save=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done

          if [ -f /tmp/base-image.tar ]; then
            echo "::warning::could not refresh $IMAGE (registry 429?); using the cached copy"
          else
            echo "::error::could not pull $IMAGE and no cached copy exists; re-run the job"
            exit 1
          fi

      - name: Save base image
        if: steps.load.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/base-image.tar
          key: ${{ steps.base.outputs.key }}

      - name: Build and run as the platform does
        working-directory: src/local_tests
        run: |
          # Most recent 6-hourly cycle, so live data exists for real connectors.
          T0=$(date -u -d "$(date -u +%Y-%m-%d) $(( $(date -u +%-H) / 6 * 6 )):00" +%Y%m%dT%H0000Z)
          CPU=$(( $(jq .cpu_units ../submission.json) / 1024 ))
          MEM="$(jq .memory_mib ../submission.json)m"
          echo "t0=$T0 cpu=$CPU mem=$MEM"
          CPU=$CPU MEM=$MEM ./test_local.sh "$T0"

      - name: Dev-only folders are not in the image
        run: |
          docker run --rm --entrypoint ls swp-local -A /app | tee app.txt
          if grep -qxE 'data|experiments|training|local_tests' app.txt; then
            echo "::error::dev-only folder found in /app"; exit 1
          fi

      - name: Package submission
        run: bash package_submission.sh

      - uses: actions/upload-artifact@v7
        with:
          name: submission-${{ github.sha }}
          path: |
            submission.zip
            src/local_tests/out/forecast.json
          retention-days: 30
          if-no-files-found: error
